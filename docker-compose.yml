version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: efes-mongo
    # MongoDB faqat ichki Docker tarmog'ida — tashqi portga chiqarilmaydi.
    # Local debug uchun: ports: - "127.0.0.1:27017:27017"
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: ./backend
    container_name: efes-backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/efes_delivery
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: efes-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  admin:
    build: ./admin
    container_name: efes-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: efes-bot
    env_file: ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/efes_delivery
    depends_on:
      mongodb:
        condition: service_healthy
      - backend
    restart: always

volumes:
  mongo_data:
